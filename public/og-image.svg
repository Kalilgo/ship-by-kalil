<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="Matías Kalil Gómez  Full Stack Developer">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0f"/>
      <stop offset="50%" style="stop-color:#12121a"/>
      <stop offset="100%" style="stop-color:#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="200" cy="120" r="180" fill="#2563eb" opacity="0.12"/>
  <circle cx="1050" cy="520" r="220" fill="#06b6d4" opacity="0.08"/>
  <text x="600" y="260" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="72" font-weight="800" fill="#f0f0f5" letter-spacing="-0.02em">Matías Kalil Gómez</text>
  <text x="600" y="340" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="36" font-weight="600" fill="url(#accent)">Full Stack Developer</text>
  <text x="600" y="420" text-anchor="middle" font-family="system-ui,Segoe UI,sans-serif" font-size="22" fill="#8888aa">React · Astro · .NET · AWS</text>
  <rect x="450" y="480" width="300" height="4" rx="2" fill="url(#accent)" opacity="0.9" filter="url(#glow)"/>
</svg>
